<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Honey Split</title>
    </head>
    <body>
        <div class="overlay hidden"></div>
        <div class="nav">
            <div class="logo-img-name">
                <img
                    class="logo"
                    src="/images/honey_split.png"
                    alt="your image"
                />
                <h3 class="user-nav-image dark-text">Our Expenses</h3>
            </div>
            <h1 id="title" class="dark-text">Honey Split</h1>
            <div class="hamburger hidden">
                <div class="line1 line"></div>
                <div class="line2 line"></div>
                <div class="line3 line"></div>
            </div>
        </div>
        <!--
        <div class="side-panel">
            <h2 class="side-panel-option">Edit Profile</h2>
            <div class="side-panel-groups">
                <h2 class="side-panel-option">Groups</h2>
                <div class="side-panel-options-group">
                    <h4 class="side-panel-group-option">Travel</h4>
                </div>
                <h2 class="side-panel-option">Edit Group</h2>
                <h2 class="side-panel-option">Create Group</h2>
            </div>
            <h2 class="side-panel-option">Sign Out</h2>
        </div>

    -->

        <div class="group-transaction-bg">
            <div class="group-transaction-main">
                <div class="user-img-name-transaction">
                    <div class="avatar-border">
                        <img
                            class="user-image-transaction user-left-img"
                            src="/images/man.png"
                            alt="your image"
                        />
                    </div>

                    <h2 class="text-margin">Joe</h2>
                </div>

                <div class="left-side-user hidden-display">
                    <h3 class="user-owes">Joe owes Amber</h3>

                    <img
                        src="images/arrow.svg"
                        class="left-arrow arrow"
                        alt="arrow pointing to who owes money for the expense"
                    />
                </div>

                <div class="transaction-total-group">
                    <div class="transaction-box">
                        <h1 class="transaction-final-total-group text-margin">
                            $<span class="transaction-final-total"></span>
                        </h1>
                        <p
                            class="settled-balance-message hidden"
                            aria-live="polite"
                        ></p>
                        <button type="button" class="btn settle-up-btn">
                            Settle Up
                        </button>
                    </div>
                    <div class="transaction-box">
                        <h4 class="transactions-all text-margin">
                            Total transactions:
                            <span class="transactions-num-all"></span>
                        </h4>

                        <h4 class="total-spent text-margin">
                            Total spent:
                            <span class="total-spent-num-all"></span>
                        </h4>
                    </div>
                </div>

                <div class="right-side-user hidden-display">
                    <h3 class="user-owes">Amber owes Joe</h3>
                    <img
                        src="images/arrow.svg"
                        class="right-arrow arrow"
                        alt="arrow pointing to who owes money for the expense"
                    />
                </div>

                <div class="user-img-name-transaction">
                    <div class="avatar-border">
                        <img
                            class="user-image-transaction user-right-img"
                            src="/images/woman.png"
                            alt="your image"
                        />
                    </div>

                    <h2 class="text-margin user-main-img user-name_transaction">
                        Amber
                    </h2>
                </div>
            </div>
        </div>

        <!--<div class="options-group">
            <h5 class="transaction-option text-margin">Transactions</h5>
            <h5 class="activity-option text-margin">Recent Activity</h5>
        </div>-->

        <div class="modal hidden">
            <button type="button" class="close-btn">x</button>
            <form id="expense-form">
                <h4>*Expense Title</h4>
                <label for="form-title"></label>
                <input id="form-title" name="form-title" type="text" required />

                <h4>*Who Paid</h4>
                <label for="user-name-select"></label>
                <select name="user-name-select" id="user-name-select" required>
                    <option value="" disabled selected>Choose who paid</option>
                    <option value="Joe">Joe</option>
                    <option value="Amber">Amber</option>
                </select>

                <h4>*Amount</h4>
                <label for="form-amount">$</label>
                <input
                    type="number"
                    id="form-amount"
                    name="form-amount"
                    placeholder="0"
                    min="0"
                    step="0.01"
                    required
                />

                <h4>Date</h4>
                <label for="form-expense-date"></label>
                <input
                    type="date"
                    id="form-expense-date"
                    name="form-expense-date"
                    value=""
                />

                <button type="submit" class="btn save-transaction-btn">
                    Save Transaction
                </button>
                <button
                    type="button"
                    class="btn save-transaction-btn delete-transaction-btn hidden"
                >
                    Delete Transaction
                </button>
            </form>
        </div>

        <div class="transaction-all-group">
            <h5 class="filter-option text-margin filter-text hidden-display">
                Filter Transactions
            </h5>
            <div class="transaction-group-bg">
                <button class="btn add-transaction-btn">
                    + Add transaction
                </button>
                <div class="transaction-all-info-group">
                    <div class="transaction-top-group">
                        <div class="month-filter">
                            <button
                                type="button"
                                class="month-year text-margin transaction-top-group-margin"
                            >
                                <span class="month-year-select"></span>
                                <span class="drop-arrow">▼</span>
                            </button>
                            <div class="month-year-picker hidden">
                                <select id="year-select">
                                    <option value="">Select year</option>
                                </select>
                                <select id="month-select">
                                    <option value="">Select month</option>
                                </select>
                            </div>
                        </div>

                        <div class="total-spent-expenses-group">
                            <h5
                                class="total-spent-month text-margin transaction-top-group-margin"
                            >
                                <span class="total-spent-num-group"
                                    ><span>$</span
                                    ><span class="total-spent-num-month"></span
                                ></span>
                                total spent
                            </h5>
                            <div
                                class="line line-transaction transaction-top-group-margin"
                            ></div>
                            <h5
                                class="total-expenses-month text-margin transaction-top-group-margin"
                            >
                                <span class="total-expense-month-num"></span>
                                expenses
                            </h5>
                        </div>
                    </div>
                    <div class="expense-list"></div>

                    <!-- add bottom line here -->
                </div>
            </div>
        </div>
        <script type="module" src="/js/app.js"></script>
    </body>
</html>
